<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#13161d;--bg3:#1a1e28;--bg4:#21263300;
  --panel:#161b24;--panel2:#1c2230;
  --bdr:#ffffff0f;--bdr2:#ffffff18;
  --or:#c03a1c;--orh:#e04a20;--or1:#c03a1c18;--or2:#c03a1c30;
  --gn:#22c55e;--gn1:#22c55e15;
  --bl:#3b82f6;--bl1:#3b82f615;
  --am:#f59e0b;--am1:#f59e0b15;
  --rd:#ef4444;--rd1:#ef444415;
  --pu:#8b5cf6;--pu1:#8b5cf615;
  --pk:#ec4899;--pk1:#ec489915;
  --t1:#f0f4ff;--t2:#b8c4dd;--t3:#6b7a99;--t4:#3d4a63;--t5:#252d3d;
  --mono:'DM Mono',monospace;
  --font:'DM Sans',system-ui,sans-serif;
  --r4:4px;--r6:6px;--r8:8px;--r12:12px;
}
html,body{font-family:var(--font);background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;height:100%}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
input,textarea,select{font-family:var(--font)}
textarea{resize:vertical}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:4px}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}

/* ── LAYOUT ── */
#shell{display:flex;height:100vh;overflow:hidden}
.sb{width:220px;min-width:220px;background:var(--panel);border-right:1px solid var(--bdr);display:flex;flex-direction:column;position:relative}
.sb::after{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:linear-gradient(to bottom,transparent,var(--or),transparent);opacity:.6}
.main{flex:1;overflow-y:auto;background:var(--bg)}

/* ── SIDEBAR ── */
.sb-top{padding:20px 16px 14px;border-bottom:1px solid var(--bdr)}
.sb-brand{display:flex;align-items:center;gap:10px}
.sb-logomark{width:32px;height:32px;background:linear-gradient(135deg,var(--or),#e05530);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.sb-name{font-size:14px;font-weight:700;letter-spacing:-.02em;color:var(--t1)}
.sb-tag{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--or);background:var(--or1);padding:2px 6px;border-radius:3px;margin-top:1px}
.sb-nav{flex:1;padding:8px 8px;overflow-y:auto}
.sb-sec{padding:10px 8px 4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t4)}
.nv{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;font-weight:500;color:var(--t3);border-radius:var(--r6);cursor:pointer;transition:all .12s;margin-bottom:1px;position:relative}
.nv:hover{background:var(--bg3);color:var(--t2)}
.nv.on{background:var(--or1);color:var(--or)}
.nv.on::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--or);border-radius:2px}
.nv i{font-size:15px;width:17px;flex-shrink:0}
.nv-badge{margin-left:auto;font-size:9px;font-weight:700;background:var(--rd);color:#fff;padding:1px 5px;border-radius:10px}
.sb-bot{padding:10px 8px;border-top:1px solid var(--bdr)}
.admin-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r6);cursor:pointer;transition:background .12s}
.admin-chip:hover{background:var(--bg3)}
.admin-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--or),#e05530);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.admin-nm{font-size:12px;font-weight:600;color:var(--t2)}
.admin-role{font-size:10px;color:var(--t4)}

/* ── PAGE HEADER ── */
.ph{padding:20px 28px 16px;border-bottom:1px solid var(--bdr);background:var(--panel);position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between}
.ph-left h1{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--t1)}
.ph-left p{font-size:12px;color:var(--t3);margin-top:2px}
.ph-right{display:flex;align-items:center;gap:8px}
.cnt{padding:24px 28px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r6);border:none;cursor:pointer;transition:all .14s;white-space:nowrap}
.btn-or{background:var(--or);color:#fff}
.btn-or:hover{background:var(--orh)}
.btn-ghost{background:var(--bg3);color:var(--t2);border:1px solid var(--bdr2)}
.btn-ghost:hover{background:var(--bg3);border-color:var(--bdr2);color:var(--t1)}
.btn-danger{background:var(--rd1);color:var(--rd);border:1px solid var(--rd)30}
.btn-danger:hover{background:var(--rd)25}
.btn-success{background:var(--gn1);color:var(--gn);border:1px solid var(--gn)30}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:var(--r4)}
.btn-xs{padding:3px 8px;font-size:10px;border-radius:var(--r4)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;font-size:10px;font-weight:600;border-radius:3px}
.b-gn{background:var(--gn1);color:var(--gn)}
.b-rd{background:var(--rd1);color:var(--rd)}
.b-am{background:var(--am1);color:var(--am)}
.b-bl{background:var(--bl1);color:var(--bl)}
.b-pu{background:var(--pu1);color:var(--pu)}
.b-or{background:var(--or1);color:var(--or)}
.b-gy{background:var(--bg3);color:var(--t3)}

/* ── CARDS ── */
.card{background:var(--panel);border:1px solid var(--bdr);border-radius:var(--r12)}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3)}
.card-body{padding:16px}

/* ── FORM ── */
.inp{width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:var(--r6);color:var(--t1);font-size:12.5px;outline:none;transition:border-color .14s}
.inp:focus{border-color:var(--or)}
.inp::placeholder{color:var(--t4)}
.lbl{display:block;font-size:10px;font-weight:700;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.fg{margin-bottom:12px}
select.inp option{background:var(--panel)}
.tog{position:relative;width:36px;height:20px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:var(--bg3);border:1px solid var(--bdr2);border-radius:10px;cursor:pointer;transition:all .2s}
.tog input:checked+.tog-sl{background:var(--or);border-color:var(--or)}
.tog-sl::before{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .2s}
.tog input:checked+.tog-sl::before{transform:translateX(16px)}

/* ── STAT CARDS ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--bdr);border-radius:var(--r12);padding:18px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-n{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1;margin-bottom:4px;letter-spacing:-.02em}
.stat-l{font-size:11px;color:var(--t3)}
.stat-delta{font-size:10px;font-weight:600;display:flex;align-items:center;gap:3px;margin-top:6px}
.stat-icon{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:var(--r8);display:flex;align-items:center;justify-content:center;font-size:17px}

/* ── TABLE ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--bdr)}
th{padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t4);text-align:left;white-space:nowrap}
td{padding:10px 12px;font-size:12.5px;color:var(--t2);border-bottom:1px solid var(--bdr)50;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--bg3)80}
.td-mono{font-family:var(--mono);font-size:12px}
.td-bold{font-weight:600;color:var(--t1)}

/* ── TABS ── */
.tab-bar{display:flex;gap:4px;margin-bottom:20px;background:var(--panel);padding:4px;border-radius:var(--r8);border:1px solid var(--bdr);width:fit-content}
.tab{padding:6px 14px;font-size:12px;font-weight:600;color:var(--t3);border-radius:var(--r6);cursor:pointer;transition:all .14s}
.tab.on{background:var(--or);color:#fff}
.tab:hover:not(.on){color:var(--t2);background:var(--bg3)}

/* ── SEARCH BAR ── */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:var(--r6);padding:7px 12px;width:240px}
.search-bar i{color:var(--t4);font-size:14px;flex-shrink:0}
.search-bar input{background:none;border:none;outline:none;color:var(--t1);font-size:12.5px;width:100%}
.search-bar input::placeholder{color:var(--t4)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--panel);border:1px solid var(--bdr2);border-radius:var(--r12);width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal-hd{padding:18px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:14px;font-weight:700}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--r4);color:var(--t3);cursor:pointer;background:var(--bg3)}
.modal-close:hover{color:var(--t1);background:var(--bdr2)}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:8px}

/* ── PRICING CARDS ── */
.price-edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pe-card{background:var(--panel);border:1px solid var(--bdr);border-radius:var(--r12);padding:20px;position:relative}
.pe-card.featured{border-color:var(--or)}
.pe-card-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--or);color:#fff;font-size:9px;font-weight:700;padding:2px 10px;border-radius:10px}
.pe-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:10px}
.pe-price{display:flex;align-items:baseline;gap:4px;margin-bottom:4px}
.pe-amt{font-family:var(--mono);font-size:32px;font-weight:500;color:var(--t1)}
.pe-per{font-size:11px;color:var(--t4)}
.pe-desc{font-size:11px;color:var(--t3);margin-bottom:14px;line-height:1.5}
.pe-feat-list{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.pe-feat{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--t2)}
.pe-feat i{font-size:12px;color:var(--gn)}
.pe-actions{display:flex;gap:6px}

/* ── CHART CONTAINERS ── */
.chart-wrap{position:relative;width:100%}

/* ── SETTINGS SECTIONS ── */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bdr)50}
.set-row:last-child{border-bottom:none}
.set-label{font-size:12.5px;font-weight:500;color:var(--t2)}
.set-desc{font-size:11px;color:var(--t4);margin-top:2px}

/* ── ACTIVITY FEED ── */
.act-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)40}
.act-item:last-child{border-bottom:none}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.act-time{font-family:var(--mono);font-size:10px;color:var(--t4);white-space:nowrap}
.act-text{font-size:12px;color:var(--t2);line-height:1.4}
.act-user{font-weight:600;color:var(--t1)}

/* ── PROGRESS ── */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prog-label{font-size:11.5px;color:var(--t2);width:80px;flex-shrink:0}
.prog-track{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .8s ease}
.prog-val{font-family:var(--mono);font-size:10px;color:var(--t3);width:30px;text-align:right}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:6px}
.tst{background:var(--panel2);color:var(--t1);padding:10px 14px;border-radius:var(--r8);font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px;min-width:220px;border:1px solid var(--bdr2);box-shadow:0 8px 28px rgba(0,0,0,.4);animation:tup .2s ease}
@keyframes tup{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ── GRID ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.g24{display:grid;grid-template-columns:2fr 4fr;gap:16px}
</style>
</head>

let currentView = 'overview';
let revChart = null, planChart = null;

function go(v) {
  currentView = v;
  document.querySelectorAll('.nv').forEach(el => el.classList.toggle('on', el.dataset.v === v));
  render();
}

function render() {
  const views = {
    overview, analytics, users, subscriptions, pricing, landing, emails, announcements, ai, integrations, logs, settings
  };
  document.getElementById('mainarea').innerHTML = (views[currentView] || overview)();
  bindView();
}

function bindView() {
  if (currentView === 'analytics') setTimeout(() => {
    drawRevChart();
    drawPlanChart();
  }, 60);
}

/* ═══════════ HELPERS ═══════════ */
function toast(m, ok = true) {
  const w = document.getElementById('tw');
  const e = document.createElement('div');
  e.className = 'tst';
  e.innerHTML = `<i class="ti ${ok ? 'ti-circle-check' : 'ti-alert-circle'}" style="color:${ok ? 'var(--gn)' : 'var(--rd)'};font-size:14px"></i>${m}`;
  w.appendChild(e);
  setTimeout(() => { e.style.opacity = '0'; e.style.transition = 'opacity .3s'; setTimeout(() => e.remove(), 300); }, 3200);
}

function openModal(html) {
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">${html}</div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function ph(title, sub, extra = '') {
  return `<div class="ph"><div class="ph-left"><h1>${title}</h1><p>${sub}</p></div><div class="ph-right">${extra}</div></div>`;
}

function pricingCard(plan) {
  return `<div class="pe-card ${plan.popular ? 'featured' : ''}" id="plan-${plan.id}">

  </div>

  <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t4);margin-bottom:8px">Features</div>

    ${plan.features.map((f, i) => `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
      <i class="ti ti-check" style="font-size:11px;color:var(--gn);flex-shrink:0"></i>
      <input class="inp" style="font-size:11.5px;padding:4px 7px;flex:1" value="${f}" onchange="DB.plans.find(p=>p.id==='${plan.id}').features[${i}]=this.value">
      <button class="btn btn-danger btn-xs" onclick="removeFeat('${plan.id}',${i})"><i class="ti ti-x"></i></button>
    </div>`).join('')}

  </div>
</div>`;
}

function togglePlan(id, val) { DB.plans.find(p => p.id === id).active = val; toast(`Plan ${val ? 'enabled' : 'disabled'}`); }
function addFeat(id) {
  const plan = DB.plans.find(p => p.id === id);
  plan.features.push('New feature');
  go('pricing');
  toast('Feature added');
}
function removeFeat(id, i) {
  DB.plans.find(p => p.id === id).features.splice(i, 1);
  go('pricing');
  toast('Feature removed');
}

    <div class="card-hd"><span class="card-title">Active Announcements (${DB.announcements.filter(a=>a.active).length} live)</span></div>
    <div class="card-body" style="padding:0">
      ${DB.announcements.map(a => `
      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bdr)40;${DB.announcements.indexOf(a)===DB.announcements.length-1?'border-bottom:none':''}">
        <div style="width:8px;height:8px;border-radius:50%;background:${a.type==='warning'?'var(--am)':a.type==='success'?'var(--gn)':'var(--bl)'};flex-shrink:0"></div>
        <div style="flex:1">
          <div style="font-size:12.5px;font-weight:600;color:var(--t1)">${a.title}</div>
          <div style="font-size:11.5px;color:var(--t3);margin-top:2px">${a.message}</div>
        </div>
        <span class="badge b-gy" style="font-size:10px">${a.created}</span>
        <span class="badge ${a.active?'b-gn':'b-gy'}">${a.active?'Live':'Inactive'}</span>
        <div style="display:flex;gap:4px">
          <button class="btn btn-ghost btn-xs" onclick="toggleAnnouncement(${a.id})"><i class="ti ti-${a.active?'eye-off':'eye'}"></i></button>
          <button class="btn btn-ghost btn-xs" onclick="openEditAnnouncementModal(${a.id})"><i class="ti ti-edit"></i></button>
          <button class="btn btn-danger btn-xs" onclick="toast('Announcement deleted',false)"><i class="ti ti-trash"></i></button>
        </div>
      </div>`).join('')}
    </div>
  </div>
</div>`;
}

function toggleAnnouncement(id) {
  const a = DB.announcements.find(x => x.id === id);
  if (a) { a.active = !a.active; toast(`Announcement ${a.active ? 'enabled' : 'disabled'}`); go('announcements'); }
}
function openNewAnnouncementModal() { openEditAnnouncementModal(null); }
function openEditAnnouncementModal(id) {
  const a = id ? DB.announcements.find(x => x.id === id) : null;
  openModal(`<div class="modal">
    <div class="modal-hd"><span class="modal-title">${a ? 'Edit' : 'New'} Announcement</span><div class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></div></div>
    <div class="modal-body">
      <div class="fg"><label class="lbl">Title</label><input class="inp" value="${a?.title||''}" placeholder="e.g. Scheduled Maintenance"></div>
      <div class="fg"><label class="lbl">Message</label><textarea class="inp" style="min-height:70px" placeholder="Short message shown to users…">${a?.message||''}</textarea></div>
      <div class="fg"><label class="lbl">Type</label><select class="inp"><option value="info" ${a?.type==='info'?'selected':''}>Info (blue)</option><option value="success" ${a?.type==='success'?'selected':''}>Success (green)</option><option value="warning" ${a?.type==='warning'?'selected':''}>Warning (amber)</option><option value="error">Error (red)</option></select></div>
      <div class="fg"><label class="lbl">Target audience</label><select class="inp"><option>All users</option><option>Free plan only</option><option>Pro + Teams only</option><option>Admins only</option></select></div>
      <div class="set-row" style="border:none;padding-top:0"><div><div class="set-label">Active (visible to users)</div></div><label class="tog"><input type="checkbox" ${a?.active?'checked':''} onchange=""><span class="tog-sl"></span></label></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-or btn-sm" onclick="closeModal();toast('Announcement saved')"><i class="ti ti-device-floppy"></i> Save</button>
    </div>
  </div>`);
}

/* ── AI CONFIG ── */
function ai() {
  return ph('AI Configuration', 'Control AI model settings, rate limits, and behaviour.', `
    <button class="btn btn-or btn-sm" onclick="toast('AI config saved')"><i class="ti ti-device-floppy"></i> Save Config</button>
  `) + `<div class="cnt">
  <div class="g2" style="margin-bottom:16px">
    <div class="card">
      <div class="card-hd"><span class="card-title">Model Settings</span></div>
      <div class="card-body">
        <div class="fg"><label class="lbl">Model</label><select class="inp" onchange="DB.ai.model=this.value">
          <option ${DB.ai.model==='claude-sonnet-4-20250514'?'selected':''}>claude-sonnet-4-20250514</option>
          <option>claude-opus-4-6</option>
          <option>claude-haiku-4-5-20251001</option>
        </select></div>
        <div class="fg"><label class="lbl">Default max tokens</label><input class="inp" type="number" value="${DB.ai.maxTokens}" onchange="DB.ai.maxTokens=+this.value"></div>
        <div class="fg"><label class="lbl">Analysis max tokens</label><input class="inp" type="number" value="${DB.ai.analysisTokens}" onchange="DB.ai.analysisTokens=+this.value"></div>
        <div class="fg"><label class="lbl">Temperature</label><input class="inp" type="number" step="0.1" min="0" max="2" value="${DB.ai.temperature}" onchange="DB.ai.temperature=+this.value"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-title">Rate Limiting</span></div>
      <div class="card-body">
        <div class="fg"><label class="lbl">Requests per user</label><input class="inp" type="number" value="${DB.ai.rateLimitPerUser}" onchange="DB.ai.rateLimitPerUser=+this.value"></div>
        <div class="fg"><label class="lbl">Per period</label><select class="inp"><option>hour</option><option ${DB.ai.rateLimitPeriod==='day'?'selected':''}>day</option><option>month</option></select></div>
        <div class="set-row"><div><div class="set-label">Fallback on rate limit</div><div class="set-desc">Use cached/demo responses when limit exceeded</div></div><label class="tog"><input type="checkbox" ${DB.ai.fallbackEnabled?'checked':''} onchange="DB.ai.fallbackEnabled=this.checked"><span class="tog-sl"></span></label></div>
        <div class="set-row"><div><div class="set-label">Log all AI requests</div><div class="set-desc">Store request/response logs for debugging</div></div><label class="tog"><input type="checkbox" ${DB.ai.loggingEnabled?'checked':''} onchange="DB.ai.loggingEnabled=this.checked"><span class="tog-sl"></span></label></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-hd"><span class="card-title">System Prompt Templates</span></div>
    <div class="card-body">
      ${[['ATS Analysis prompt','You are an expert ATS résumé analyser. Return ONLY valid JSON with atsScore, readability, sections, feedback, keywords…'],['Job Match prompt','You are a job-résumé matching expert. Return ONLY valid JSON with score, matched keywords, missing keywords, suggestions…'],['Bullet Rewriter prompt','Expert résumé writer. Rewrite weak bullets into compelling, metrics-driven achievements. Return ONLY the rewritten bullet.'],['AI Coach system prompt','You are iScanResume\'s AI career coach — an expert recruiter and career advisor. Be specific, actionable, encouraging…']].map(([l,v])=>`
      <div class="fg"><label class="lbl">${l}</label><textarea class="inp" style="min-height:68px;font-size:11.5px;font-family:var(--mono)">${v}</textarea></div>`).join('')}
    </div>
  </div>
</div>`;
}

/* ── INTEGRATIONS ── */
function integrations() {
  return ph('Integrations', 'Manage third-party service connections.') + `<div class="cnt">
  <div class="g2">
    ${[
      {name:'Stripe',ic:'ti-credit-card',desc:'Payment processing & subscription billing',status:'connected',col:'var(--pu)'},
      {name:'SendGrid',ic:'ti-mail',desc:'Transactional email delivery',status:'connected',col:'var(--bl)'},
      {name:'Google Analytics',ic:'ti-chart-bar',desc:'Website traffic and conversion tracking',status:DB.landing.googleAnalyticsId?'connected':'not connected',col:'var(--am)'},
      {name:'Intercom',ic:'ti-message-circle',desc:'In-app customer support chat',status:DB.landing.intercomId?'connected':'not connected',col:'var(--bl)'},
      {name:'Sentry',ic:'ti-bug',desc:'Error tracking and performance monitoring',status:'connected',col:'var(--rd)'},
      {name:'AWS S3',ic:'ti-cloud',desc:'File storage for résumé uploads',status:'connected',col:'var(--or)'},
      {name:'Slack',ic:'ti-brand-slack',desc:'Internal alerts and notifications',status:'not connected',col:'var(--pu)'},
      {name:'HubSpot',ic:'ti-users',desc:'CRM and marketing automation',status:'not connected',col:'var(--or)'},
    ].map(i=>`
    <div class="card" style="display:flex;gap:12px;padding:16px;align-items:flex-start">
      <div style="width:40px;height:40px;border-radius:var(--r8);background:${i.col}18;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ${i.ic}" style="color:${i.col};font-size:18px"></i></div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:3px">${i.name}</div>

        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="badge ${i.status==='connected'?'b-gn':'b-gy'}">${i.status}</span>
          <div style="display:flex;gap:6px">
            ${i.status==='connected'?`<button class="btn btn-ghost btn-xs" onclick="toast('${i.name} settings opened')"><i class="ti ti-settings"></i></button><button class="btn btn-danger btn-xs" onclick="toast('${i.name} disconnected',false)">Disconnect</button>`:`<button class="btn btn-or btn-xs" onclick="toast('${i.name} connected ✓')">Connect</button>`}
          </div>
        </div>
      </div>
    </div>`).join('')}

</div>`;
}

/* ── LOGS ── */
function logs() {
  const levelColor = { INFO:'var(--bl)', WARN:'var(--am)', ERROR:'var(--rd)' };
  return ph('System Logs', 'Real-time application logs and error tracking.', `
    <div class="search-bar"><i class="ti ti-search"></i><input placeholder="Filter logs…"></div>
    <select class="inp" style="width:120px;padding:6px 10px"><option>All levels</option><option>ERROR</option><option>WARN</option><option>INFO</option></select>
    <button class="btn btn-danger btn-sm" onclick="toast('Logs cleared',false)"><i class="ti ti-trash"></i> Clear</button>
  `) + `<div class="cnt">
  <div class="card" style="margin-bottom:16px">
    <div class="card-hd">
      <span class="card-title">Live Log Stream</span>
      <div style="display:flex;align-items:center;gap:6px"><div style="width:6px;height:6px;border-radius:50%;background:var(--gn);animation:pulse 2s infinite"></div><span style="font-size:11px;color:var(--gn)">Live</span></div>
    </div>
    <div style="padding:12px 16px;font-family:var(--mono);font-size:11.5px;background:var(--bg);border-radius:0 0 var(--r12) var(--r12);max-height:480px;overflow-y:auto">
      ${DB.logs.map(l=>`
      <div style="display:flex;gap:14px;padding:5px 0;border-bottom:1px solid var(--bdr)30;line-height:1.4">
        <span style="color:var(--t4);flex-shrink:0;min-width:56px">${l.time}</span>
        <span style="color:${levelColor[l.level]||'var(--t3)'};font-weight:600;min-width:36px;flex-shrink:0">${l.level}</span>
        <span style="color:var(--pu);flex-shrink:0;min-width:80px">${l.service}</span>
        <span style="color:var(--t2)">${l.msg}</span>
      </div>`).join('')}
    </div>
  </div>
  <div class="g3">
    ${[['Total Errors (24h)','12','var(--rd)'],['Warnings (24h)','3','var(--am)'],['Uptime','99.97%','var(--gn)']].map(([l,v,c])=>`
    <div class="stat">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t4);margin-bottom:8px">${l}</div>
      <div class="stat-n" style="color:${c}">${v}</div>
    </div>`).join('')}
  </div>
</div>
<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}</style>`;
}

/* ── SETTINGS ── */
function settings() {
  return ph('Settings', 'Global platform configuration and admin access.', `
    <button class="btn btn-or btn-sm" onclick="toast('Settings saved')"><i class="ti ti-device-floppy"></i> Save</button>
  `) + `<div class="cnt">
  <div class="g2" style="margin-bottom:16px">
    <div class="card">
      <div class="card-hd"><span class="card-title">General</span></div>
      <div class="card-body">
        <div class="fg"><label class="lbl">Platform name</label><input class="inp" value="iScanResume" style="font-weight:700"></div>
        <div class="fg"><label class="lbl">Support email</label><input class="inp" value="support@iscanresume.com"></div>
        <div class="fg"><label class="lbl">Default timezone</label><select class="inp"><option>UTC</option><option>America/New_York</option><option>Europe/London</option></select></div>
        <div class="fg"><label class="lbl">Date format</label><select class="inp"><option>YYYY-MM-DD</option><option>MM/DD/YYYY</option><option>DD/MM/YYYY</option></select></div>

        <div class="set-row"><div><div class="set-label">Session timeout</div><div class="set-desc">Auto-logout after inactivity</div></div><label class="tog"><input type="checkbox" checked onchange="toast('Session timeout '+(this.checked?'enabled':'disabled'))"><span class="tog-sl"></span></label></div>
        <div class="set-row"><div><div class="set-label">Audit logging</div><div class="set-desc">Log all admin actions to audit trail</div></div><label class="tog"><input type="checkbox" checked onchange="toast('Audit logging '+(this.checked?'enabled':'disabled'))"><span class="tog-sl"></span></label></div>
        <div class="fg" style="margin-top:12px"><label class="lbl">Session timeout (minutes)</label><input class="inp" type="number" value="60"></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-hd"><span class="card-title">Admin Accounts</span><button class="btn btn-or btn-sm" onclick="openAddAdminModal()"><i class="ti ti-plus"></i> Add Admin</button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last Login</th><th>2FA</th><th>Actions</th></tr></thead>
        <tbody>
          ${[['Super Admin','admin@iscanresume.com','Super Admin','2 min ago',true],['Content Editor','content@iscanresume.com','Editor','1 hr ago',true],['Support Agent','support1@iscanresume.com','Support','3 hr ago',false]].map(([n,e,r,l,mfa])=>`
          <tr>
            <td class="td-bold">${n}</td>
            <td style="color:var(--t3);font-size:12px">${e}</td>
            <td><span class="badge ${r==='Super Admin'?'b-or':r==='Editor'?'b-bl':'b-gy'}">${r}</span></td>
            <td style="color:var(--t4);font-size:11.5px">${l}</td>
            <td><span class="badge ${mfa?'b-gn':'b-rd'}">${mfa?'On':'Off'}</span></td>
            <td><div style="display:flex;gap:4px"><button class="btn btn-ghost btn-xs" onclick="toast('Admin settings opened')"><i class="ti ti-edit"></i></button><button class="btn btn-danger btn-xs" onclick="toast('Admin removed',false)"><i class="ti ti-trash"></i></button></div></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div class="g2">
    <div class="card">
      <div class="card-hd"><span class="card-title">Danger Zone</span></div>
      <div class="card-body">
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn btn-danger" style="justify-content:flex-start" onclick="toast('Cache cleared',false)"><i class="ti ti-refresh"></i> Clear all caches</button>
          <button class="btn btn-danger" style="justify-content:flex-start" onclick="toast('Scheduled — 2am UTC',false)"><i class="ti ti-database"></i> Run database backup</button>
          <button class="btn btn-danger" style="justify-content:flex-start" onclick="toast('Export started — you will receive an email',false)"><i class="ti ti-download"></i> Export all user data (GDPR)</button>
          <button class="btn btn-danger" style="justify-content:flex-start" onclick="if(confirm('Are you sure? This cannot be undone.'))toast('All analyses deleted',false)"><i class="ti ti-trash"></i> Delete all analysis data</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-title">Platform Info</span></div>
      <div class="card-body">
        ${[['Version','v2.4.1'],['Environment','Production'],['Node.js','v20.11.0'],['Database','PostgreSQL 16.2'],['Last deploy','2025-05-21 09:44 UTC'],['Next maintenance','None scheduled']].map(([l,v])=>`
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr)40;font-size:12px">

          <span style="font-family:var(--mono);color:var(--t2)">${v}</span>

</div>`;
}

  openModal(`<div class="modal">

render();
